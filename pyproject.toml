[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "aoe2-coach-collector"
version = "0.1.0"
description = "Read-only AoE2Control Agent Bridge V3 telemetry collector"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
aoe2-collect = "aoe2coach.cli:main"
[tool.setuptools.packages.find]
include = ["aoe2coach*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
